<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AZoom Rental - Reserve</title>

    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body>
    <!-- HEADER -->
    <header class="header" id="top">
      <div class="header-wrap">
        <a class="logo" href="/index.html">AZoom Rental</a>

        <nav id="main-nav" class="nav" aria-label="Primary">
          <a href="/carList.html">Cars</a>
          <a href="/rates.html">Rates</a>
          <a href="/location.html">Locations</a>
          <a href="/faq.html">FAQ</a>
        </nav>

        <button class="menu" aria-label="Open menu">
          <i class="fas fa-bars"></i>
        </button>

        <div class="login">
          <a href="#" class="btn small">Login</a>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="page">
      <section class="content">
        <h1>Reserve a Car</h1>
        <form class="form" action="#" method="post">
          <div class="grid-2">
            <label
              >Pickup location
              <input
                type="text"
                name="pickup"
                placeholder="Downtown HQ"
                required
              />
            </label>
            <label
              >Return location
              <input
                type="text"
                name="dropoff"
                placeholder="Same as pickup"
                required
              />
            </label>
            <label
              >Pickup date & time
              <input type="datetime-local" name="start" required />
            </label>
            <label
              >Return date & time
              <input type="datetime-local" name="end" required />
            </label>
            <label
              >Car type
              <select name="type" required>
                <option value="Hatch">Hatch</option>
                <option value="Sedan" selected>Sedan</option>
                <option value="SUV">SUV</option>
                <option value="MPV">MPV</option>
              </select>
            </label>
            <label
              >Extras
              <div class="checks">
                <label><input type="checkbox" name="extra_gps" /> GPS</label>
                <label
                  ><input type="checkbox" name="extra_child" /> Child
                  seat</label
                >
                <label
                  ><input type="checkbox" name="extra_driver" /> Extra
                  driver</label
                >
              </div>
            </label>
          </div>

          <label
            >Notes
            <textarea
              name="notes"
              rows="4"
              placeholder="Anything we should know?"
            ></textarea>
          </label>

          <button class="btn" type="submit">Confirm Reservation</button>
        </form>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-grid">
        <div>
          <h4>Contact</h4>
          <p>hello@azoom.example<br />+65 6000 0000</p>
        </div>
        <div>
          <h4>Links</h4>
          <p>
            <a href="/carList.html">Cars</a> ·
            <a href="#howto">How it works</a> ·
            <a href="#reviews">Reviews</a>
          </p>
        </div>
        <div>
          <h4>Follow</h4>
          <p><a href="#">Instagram</a> · <a href="#">Facebook</a></p>
        </div>
      </div>
      <div class="map">
        <a href="/carList.html">Reserve</a> | <a href="#">Rates</a> |
        <a href="#">FAQ</a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
