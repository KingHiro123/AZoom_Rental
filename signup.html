<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up – AZoom Rental</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <script src="./js/script.js" defer></script>
  </head>

  <body>
    <!-- HEADER -->
    <header class="header" id="top">
      <div class="header-wrap">
        <a href="./index.html">
          <img
            class="logo"
            src="./img/azoom-rental-high-resolution-logo-transparent.png"
            alt="AZoom Rental Logo"
          />
        </a>

        <nav id="main-nav" class="nav" aria-label="Primary">
          <a href="./carList.html">Cars</a>
          <a href="./rates.html">Rates</a>
          <a href="./location.html">Locations</a>
          <a href="./faq.html">FAQ</a>
        </nav>

        <button class="menu" aria-label="Open menu">
          <i class="fas fa-bars" aria-hidden="true"></i>
        </button>
        <div class="login">
          <a href="./login.html" class="btn small">Login</a>
        </div>
      </div>
    </header>

    <!-- MAIN -->
    <main class="login-page">
      <section class="login-card" aria-labelledby="signupTitle">
        <h1 id="signupTitle" class="xl">Create your account</h1>
        <p class="lead">Sign up to manage your bookings and profile.</p>

        <form id="signupForm" class="login-form" novalidate>
          <label class="field">
            <span>Full name</span>
            <input
              type="text"
              id="name"
              name="name"
              required
              placeholder="e.g., Jane Tan"
            />
          </label>

          <label class="field">
            <span>Email</span>
            <input
              type="email"
              id="email"
              name="email"
              required
              placeholder="you@example.com"
            />
          </label>

          <label class="field">
            <span>Password</span>
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              required
              placeholder="At least 8 characters"
            />
          </label>

          <label class="field">
            <span>Confirm password</span>
            <input
              type="password"
              id="confirm"
              name="confirm"
              minlength="8"
              required
              placeholder="Re-enter your password"
            />
          </label>

          <button type="submit" class="btn block">Create account</button>
        </form>

        <p class="mini muted">
          Already have an account? <a href="./login.html">Log in</a>
        </p>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer-grid">
        <div>
          <h4>Contact</h4>
          <p>hello@azoom.example<br />+65 6000 0000</p>
        </div>
        <div>
          <h4>Links</h4>
          <p>
            <a href="./carList.html">Cars</a> ·
            <a href="./index.html#howto">How it works</a> ·
            <a href="./index.html#reviews">Reviews</a>
          </p>
        </div>
        <div>
          <h4>Follow</h4>
          <p><a href="#">Instagram</a> · <a href="#">Facebook</a></p>
        </div>
      </div>
      <div class="map">
        <a href="./reserve.html">Reserve</a> |
        <a href="./rates.html">Rates</a> |
        <a href="./faq.html">FAQ</a>
      </div>
    </footer>
  </body>
</html>
